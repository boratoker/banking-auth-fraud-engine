server:
  port: 8080

spring:
  config:
    import: optional:file:.env
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - X-RateLimit-Remaining
            allowCredentials: true
      routes:
        # Kimlik doğrulama uç noktaları: brute-force / credential stuffing'e karşı sıkı limit
        - id: auth-service-auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

        # Bankacılık uç noktaları
        - id: auth-service-banking
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/banking/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

        # Fraud Service Route Configuration
        - id: fraud-service
          uri: ${FRAUD_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/fraud/**

        # Signing Service: dışarıya yalnızca doğrulama açıktır. Cihaz kaydı (enroll) oturum
        # doğrulaması gerektirdiği için auth-service üzerinden (/api/v1/banking/security/enroll-device) yapılır.
        - id: signing-service
          uri: ${SIGNING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/signing/verify
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

# Prometheus & Actuator Metrics Config
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    tags:
      application: ${spring.application.name}