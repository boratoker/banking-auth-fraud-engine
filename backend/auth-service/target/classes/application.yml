server:
  port: 8081

spring:
  config:
    import: optional:file:.env
  application:
    name: auth-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379
      # Redis kapalıysa istekler uzun süre bloklanmasın, in-memory yedeğe düşülsün
      timeout: 1000ms
      connect-timeout: 1000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 1000
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Broker erişilemezse REST thread'i metadata beklerken bloklanmasın
        max.block.ms: 500
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# Signing-service (Transaction Signing) adresi — imza doğrulaması transferden önce burada yapılır
signing:
  service:
    url: ${SIGNING_SERVICE_URL:http://localhost:8083}

app:
  security:
    # Geliştirme kolaylığı: "123456" ana şifre/OTP kabulü. Varsayılan olarak KAPALI.
    dev-bypass-enabled: ${DEV_BYPASS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    tags:
      application: ${spring.application.name}